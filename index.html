<head>

<link href="https://fonts.googleapis.com/css2?family=Hind+Vadodara:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#E4E8EA;--ink:#16202A;--muted:#5A6873;--panel:#FFFFFF;--line:#C9D1D6;--ecu:#1D4E89;--ref:#C8322B;--sig:#E3A600;--gnd:#6B4A2B;--scr:#0E2A2C;--trace:#7CF2C8;--grid:#1F4A4C;--ok:#1E7F4F;--no:#C8322B;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1418;--ink:#E2E9EE;--muted:#93A3AE;--panel:#16212A;--line:#27363F;--ecu:#5B9BE6;--ok:#3FCB8A;--no:#FF6B5E}}
:root[data-theme="dark"]{--bg:#0D1418;--ink:#E2E9EE;--muted:#93A3AE;--panel:#16212A;--line:#27363F;--ecu:#5B9BE6;--ok:#3FCB8A;--no:#FF6B5E}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Vadodara","Noto Sans Gujarati",system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:#1D4E89;color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;background:linear-gradient(90deg,#C8322B 0 33%,#E3A600 33% 66%,#6B4A2B 66%)}
.top button{background:none;border:0;color:#fff;font:inherit;font-size:1.3rem;padding:2px 8px;cursor:pointer;border-radius:8px}
.top .t{font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top .p{font-family:"Share Tech Mono",monospace}
.wrap{max-width:880px;margin:0 auto;padding:18px 14px 48px}
h1{font-size:clamp(1.7rem,7vw,2.6rem);line-height:1.08;margin:4px 0 8px;letter-spacing:-.01em}
h2{font-size:1.35rem;line-height:1.25;margin:2px 0 6px}h3{font-size:1.05rem;margin:14px 0 6px}
p{margin:0 0 10px;max-width:68ch}.muted{color:var(--muted)}
.hero p{font-size:1.05rem}
.map{background:var(--scr);border-radius:16px;padding:6px;margin:12px 0}
.map svg{width:100%;height:auto;display:block}
.hs{cursor:pointer}.hs circle{transition:r .15s}.hs:hover circle,.hs:focus circle{r:11}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem;margin:6px 0 14px}.legend i{display:inline-block;width:22px;height:5px;border-radius:3px;vertical-align:middle;margin-right:6px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 16px}
.big{font:inherit;font-weight:600;padding:12px 8px;border-radius:12px;border:1.5px solid var(--ecu);background:var(--panel);color:var(--ink);cursor:pointer;line-height:1.3}
.big small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.list{display:grid;gap:8px}
.row{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;color:inherit;text-align:left;font:inherit;width:100%}

.row.done .ab{background:var(--ok)}.row .b{flex:1;min-width:0}.row .b b{display:block;line-height:1.3}.row small{color:var(--muted)}
.grp{margin:18px 0 8px;font-weight:700;color:var(--ecu)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:8px 0 12px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;font:inherit;font-weight:600;font-size:.95rem;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ecu);border-color:var(--ecu);color:#fff}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.stage{background:var(--scr);border-radius:12px;padding:6px;margin-bottom:10px}.stage svg{width:100%;height:auto;display:block}
.two{display:grid;gap:10px}@media(min-width:700px){.two{grid-template-columns:1.2fr 1fr}}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:8px 0}
.lcd{background:var(--scr);color:var(--trace);border-radius:10px;padding:7px 10px;font-family:"Share Tech Mono",monospace;font-size:1.35rem;line-height:1.2}
.lcd small{display:block;font-family:"Hind Vadodara",sans-serif;font-size:.78rem;color:#9CC9BD}
label.sl{display:block;margin:8px 0 2px;font-weight:600}label.sl b{font-family:"Share Tech Mono",monospace;color:var(--ecu)}
input[type=range]{width:100%;accent-color:var(--ecu);height:34px}
.btn{font:inherit;font-weight:600;font-size:.95rem;border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:9px 14px;border-radius:10px;cursor:pointer}
.btn.p{background:var(--ecu);border-color:var(--ecu);color:#fff}.btn.on{background:var(--sig);border-color:var(--sig);color:#211800}
.btn:disabled{opacity:.45}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.col{display:grid;gap:8px}
.opt{font:inherit;text-align:left;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}.opt.wrong{border-color:var(--no);background:color-mix(in srgb,var(--no) 12%,transparent)}
.fb{font-weight:600;min-height:1.4em;margin:8px 0}.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.pr p{font-size:1.02rem}.pr ol{padding-left:22px;margin:0 0 10px}.pr li{margin-bottom:6px}
.pins{display:grid;gap:6px;margin:8px 0}.pin{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:1px solid var(--line)}
.pin i{width:34px;height:8px;border-radius:4px;flex:0 0 34px}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.95rem}td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--muted);font-weight:600}
td.v{font-family:"Share Tech Mono",monospace;white-space:nowrap}
.meter{display:grid;gap:8px}.mrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.mrow button{flex:0 0 auto}.mrow .lcd{font-size:1.05rem;min-width:110px;text-align:right}
.note{border-left:4px solid var(--sig);padding:8px 12px;background:color-mix(in srgb,var(--sig) 12%,transparent);border-radius:8px;margin:10px 0}
.case{border-left:4px solid var(--ref);padding:10px 12px;background:color-mix(in srgb,var(--ref) 9%,transparent);border-radius:8px;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);background:var(--ecu);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;max-width:calc(100% - 28px);transition:transform .3s;z-index:30}
.toast.show{transform:translate(-50%,0)}
.foot{margin-top:26px;color:var(--muted);font-size:.9rem}
button:focus-visible,input:focus-visible,.hs:focus{outline:3px solid var(--sig);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<script>
const NTC_R=T=>2500*Math.exp(3540*(1/(T+273.15)-1/293.15));
const NTC_V=T=>{const r=NTC_R(T);return 5*r/(r+2490)};
const lin=(x,a,b)=>0.5+4*(x-a)/(b-a);
const GROUPS=['પોઝિશન અને સ્પીડ','તાપમાન','પ્રેશર અને એરફ્લો','એક્ઝોસ્ટ અને એમિશન','સ્વીચ પ્રકારના સેન્સર'];
const S=[
{id:'ckp',ab:'CKP',g:0,gu:'ક્રેન્કશાફ્ટ પોઝિશન સેન્સર',en:'Crankshaft Position Sensor',fam:'induct',at:[100,200],
 loc:'ફ્લાયવ્હીલ હાઉસિંગ કે ક્રેન્ક પુલી પાસે, 60-2 દાંતાવાળા રિલક્ટર વ્હીલની સામે.',
 job:'એન્જિનની RPM અને પિસ્ટન TDC પર ક્યારે છે તે ECU ને કહે છે. આ સિગ્નલ વગર ECU ઇન્જેક્શન કરતું નથી, એટલે એન્જિન ચાલુ જ ન થાય.',
 pr:['સેન્સરની અંદર કાયમી ચુંબક અને તેની ફરતે તારની કોઇલ હોય છે.','લોખંડનો દાંત સેન્સર પાસેથી પસાર થાય ત્યારે ચુંબકીય ક્ષેત્ર (ફ્લક્સ) વધે, અને દાંત વચ્ચેની ખાલી જગ્યા આવે ત્યારે ઘટે.','ફ્લક્સ બદલાય એટલે ફેરાડેના નિયમ મુજબ કોઇલમાં AC વોલ્ટેજ પેદા થાય. તેને ઇન્ડક્ટિવ (મેગ્નેટિક પિકઅપ) સેન્સર કહે છે.','વ્હીલ ઝડપથી ફરે તેમ વોલ્ટેજ અને ફ્રિક્વન્સી બંને વધે. 2 દાંત ખૂટે ત્યાં લાંબો ગેપ આવે, તે પરથી ECU નંબર 1 સિલિન્ડરની સ્થિતિ ઓળખે.'],
 wires:[['સિગ્નલ +','sig'],['સિગ્નલ − (રીટર્ન)','gnd'],['શીલ્ડ (અર્થ)','sh']],
 vals:[['કોઇલ રેઝિસ્ટન્સ','800–1200 Ω'],['ક્રેન્કિંગ (200 RPM)','1–3 V AC'],['આઇડલ (800 RPM)','આશરે 10 V AC'],['એર ગેપ','0.5–1.5 mm']],
 sym:['એન્જિન ક્રેન્ક થાય પણ સ્ટાર્ટ ન થાય','ચાલતું એન્જિન અચાનક બંધ થાય','ટેકોમીટર સોય હલે નહીં'],dtc:'P0335 / P0336',
 sim:{}},
{id:'cmp',ab:'CMP',g:0,gu:'કેમશાફ્ટ પોઝિશન સેન્સર',en:'Camshaft Position Sensor',fam:'hall',at:[98,50],
 loc:'સિલિન્ડર હેડના આગળના ભાગે, કેમશાફ્ટ પરના ટ્રિગર વ્હીલ કે ટાઇમિંગ પુલી પાસે.',
 job:'ક્રેન્કશાફ્ટ 2 આંટા ફરે ત્યારે કેમ 1 આંટો ફરે. આ સેન્સર કહે છે કે નંબર 1 સિલિન્ડર કમ્પ્રેશન સ્ટ્રોકમાં છે કે એક્ઝોસ્ટમાં. તેથી ECU સાચા સિલિન્ડરમાં ઇન્જેક્શન કરે.',
 pr:['હોલ ઇફેક્ટ: કરંટ વહેતી સેમિકન્ડક્ટર ચિપ પર ચુંબકીય ક્ષેત્ર લાગે ત્યારે ચિપની બાજુઓ વચ્ચે નાનો વોલ્ટેજ (હોલ વોલ્ટેજ) પેદા થાય.','ચિપની અંદરનું સર્કિટ આ નાના વોલ્ટેજને ચોખ્ખા ચોરસ (0 V કે 5 V) પલ્સમાં ફેરવે.','ટ્રિગર વ્હીલનો દાંત કે વેન ચુંબક અને ચિપ વચ્ચે આવે ત્યારે સિગ્નલ બદલાય.','ઇન્ડક્ટિવ સેન્સરથી ફરક: હોલ સેન્સરને પાવર સપ્લાય જોઈએ (3 વાયર) અને શૂન્ય ઝડપે પણ સાચું સિગ્નલ આપે.'],
 wires:[['સપ્લાય 5 V','ref'],['સિગ્નલ','sig'],['ગ્રાઉન્ડ','gnd']],
 vals:[['સપ્લાય','5 V (કેટલાકમાં 12 V)'],['સિગ્નલ','0 V / 5 V ચોરસ પલ્સ'],['પલ્સ સંખ્યા','કેમના દરેક આંટે 1 કે વધુ']],
 sym:['લાંબું ક્રેન્કિંગ પછી સ્ટાર્ટ','લિમ્પ મોડ, પાવર ઓછો','ચેક એન્જિન લાઇટ'],dtc:'P0340 / P0341',
 ref:'5.0 V',sim:{mode:'cmp'}},
{id:'vss',ab:'VSS',g:0,gu:'વ્હીકલ સ્પીડ સેન્સર',en:'Vehicle Speed Sensor',fam:'hall',at:[66,236],
 loc:'ગિયરબોક્સના આઉટપુટ શાફ્ટ પાસે (કેટલાક વાહનમાં ABS વ્હીલ સેન્સરથી).',
 job:'વાહનની ઝડપ ECU, સ્પીડોમીટર અને ક્રૂઝ કંટ્રોલને આપે. ECU ગિયર પ્રમાણે ઇંધણ અને આઇડલ નિયંત્રણમાં તેનો ઉપયોગ કરે.',
 pr:['આઉટપુટ શાફ્ટ પર ચુંબક કે દાંતાવાળું રિંગ હોય છે.','દરેક ચુંબક કે દાંત પસાર થાય ત્યારે હોલ ચિપ એક ચોરસ પલ્સ આપે.','ઝડપ વધે એટલે પલ્સની ફ્રિક્વન્સી (Hz) વધે, પણ પલ્સની ઊંચાઈ (5 V) એ જ રહે.','ECU એક સેકન્ડમાં આવતી પલ્સ ગણી km/h ગણે.'],
 wires:[['સપ્લાય 12 V','ref'],['સિગ્નલ','sig'],['ગ્રાઉન્ડ','gnd']],
 vals:[['સપ્લાય','12 V'],['સિગ્નલ','0 / 5 V પલ્સ'],['ફ્રિક્વન્સી','ઝડપના પ્રમાણમાં']],
 sym:['સ્પીડોમીટર 0 બતાવે','ક્રૂઝ કંટ્રોલ કામ ન કરે','ગિયર બદલતાં ઝટકા'],dtc:'P0500',
 ref:'12.4 V',sim:{mode:'vss'}},
{id:'app',ab:'APP',g:0,gu:'એક્સિલરેટર પેડલ પોઝિશન સેન્સર',en:'Accelerator Pedal Position Sensor',fam:'pot',at:[28,236],
 loc:'એક્સિલરેટર પેડલ એસેમ્બલીમાં જ (ડ્રાઇવ-બાય-વાયર).',
 job:'ડ્રાઇવર કેટલું પેડલ દબાવે છે તે ECU ને કહે. ECU તે મુજબ ઇંધણનો જથ્થો નક્કી કરે. પેડલ અને પંપ વચ્ચે કોઈ કેબલ નથી.',

const SVG=(w,h,inner,lbl='એનિમેશન')=>`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${lbl}">${inner}</svg>`;

function scope(pts,vmin,vmax,opt={}){const w=320,h=130,pd=8;let g='';for(let i=1;i<10;i++)g+=`<line x1="${i*32}" y1="0" x2="${i*32}" y2="${h}" stroke="#1F4A4C"/>`;for(let i=1;i<5;i++)g+=`<line x1="0" y1="${i*26}" x2="${w}" y2="${i*26}" stroke="#1F4A4C"/>`;
 const y=v=>h-pd-(v-vmin)/(vmax-vmin)*(h-2*pd);const d=pts.map((v,i)=>(i?'L':'M')+(i/(pts.length-1)*w).toFixed(1)+' '+y(v).toFixed(1)).join('');
 return SVG(w,h,`<rect width="${w}" height="${h}" fill="#0E2A2C"/>${g}${opt.zero?`<line x1="0" y1="${y(0)}" x2="${w}" y2="${y(0)}" stroke="${DIM}" stroke-dasharray="3 3"/>`:''}<path d="${d}" fill="none" stroke="${T}" stroke-width="2"/>${opt.mk!=null?`<line x1="${opt.mk*w}" y1="0" x2="${opt.mk*w}" y2="${h}" stroke="${Y}" stroke-width="1.5"/>`:''}<text x="6" y="14" fill="${DIM}" font-size="11">${opt.l||'ઓસિલોસ્કોપ'}</text><text x="${w-6}" y="14" fill="${DIM}" font-size="11" text-anchor="end">${opt.r||''}</text>`,'ઓસિલોસ્કોપ તરંગ')}
function curve(fn,xmin,xmax,x,vmax,xl,yl){const w=320,h=120,p=26;const X=v=>p+(v-xmin)/(xmax-xmin)*(w-p-8),Yv=v=>h-18-(v/vmax)*(h-30);let d='';for(let i=0;i<=60;i++){const v=xmin+(xmax-xmin)*i/60;d+=(i?'L':'M')+X(v).toFixed(1)+' '+Yv(fn(v)).toFixed(1)}
 return SVG(w,h,`<rect width="${w}" height="${h}" fill="#0E2A2C"/><line x1="${p}" y1="${h-18}" x2="${w-6}" y2="${h-18}" stroke="${DIM}"/><line x1="${p}" y1="8" x2="${p}" y2="${h-18}" stroke="${DIM}"/><path d="${d}" fill="none" stroke="${DIM}" stroke-width="2"/><circle cx="${X(x)}" cy="${Yv(fn(x))}" r="6" fill="${Y}"/><text x="${w-6}" y="${h-4}" fill="${DIM}" font-size="10" text-anchor="end">${xl}</text><text x="${p+4}" y="16" fill="${DIM}" font-size="10">${yl}</text>`,'ગ્રાફ')}
function cover(min,max,done){let lo=1e9,hi=-1e9,f=false;return v=>{lo=Math.min(lo,v);hi=Math.max(hi,v);if(!f&&hi-lo>=0.6*(max-min)){f=true;done()}}}

  <path d="M78 22 H150 V40" stroke="${Y}" stroke-width="3" fill="none"/><path d="M66 22 H40 V8 H300 V140 H260" stroke="${B}" stroke-width="3" fill="none"/>
  <rect x="210" y="26" width="98" height="98" rx="8" fill="#1D4E89"/><text x="259" y="44" fill="#fff" font-size="12" text-anchor="middle">ECU</text><text x="259" y="62" fill="#FFB4AE" font-size="11" text-anchor="middle">5 V</text>

SIM.induct=(el,s,done)=>{let rpm=800,phi=0,seen=new Set();
 el.innerHTML=`<div class="stage" id="st"></div><div class="stage" id="sc"></div><div class="readout">${lcd('rr','RPM')}${lcd('rv','પીક વોલ્ટેજ','V AC')}${lcd('rf','ફ્રિક્વન્સી','Hz')}</div>${slider('sl','એન્જિન RPM',0,4000,rpm,50,'')}<p class="muted">વ્હીલ સમજવા માટે ધીમી ગતિમાં ફરે છે. સ્કોપમાં એક આંટો: ખૂટતા દાંત પાસે સપાટ ભાગ દેખાશે.</p>`;
 const A=()=>rpm<=0?0:0.2+rpm*0.012;
 const wave=()=>{const a=A(),pts=[];for(let i=0;i<=720;i++){const ang=i/2,k=Math.floor(ang/6);pts.push(k>=58?0:a*Math.sin(2*Math.PI*ang/6))}return pts};
 let cached=null,ca=-1;
 const draw=()=>{let teeth='',best=99;for(let k=0;k<60;k++){if(k>=58)continue;const ang=(phi+k*6)%360,rad=ang*Math.PI/180,x1=95+62*Math.cos(rad),y1=88+62*Math.sin(rad),x2=95+74*Math.cos(rad),y2=88+74*Math.sin(rad);teeth+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#9AA5AA" stroke-width="4.5"/>`;const d=Math.min(ang,360-ang);best=Math.min(best,d)}
  const fl=clamp(1-best/3,0.15,1)*(rpm>0?1:0.5);
  el.querySelector('#st').innerHTML=SVG(320,176,`<circle cx="95" cy="88" r="62" fill="#2A3A40" stroke="#9AA5AA" stroke-width="2"/><circle cx="95" cy="88" r="10" fill="${W}"/>${teeth}<text x="95" y="170" fill="${DIM}" font-size="11" text-anchor="middle">60-2 રિલક્ટર વ્હીલ</text>
  <path d="M176 70 C200 60,200 116,176 106" stroke="${T}" stroke-width="2" fill="none" opacity="${fl}"/><path d="M176 78 C190 72,190 104,176 98" stroke="${T}" stroke-width="2" fill="none" opacity="${fl}"/>
  <rect x="176" y="72" width="70" height="32" rx="4" fill="#4A5560"/><rect x="200" y="76" width="40" height="24" fill="${R}"/><text x="210" y="92" fill="#fff" font-size="10">N</text><text x="226" y="92" fill="#fff" font-size="10">S</text>
  ${[0,1,2,3,4,5].map(i=>`<line x1="${181+i*3.5}" y1="70" x2="${181+i*3.5}" y2="106" stroke="${Y}" stroke-width="1.5"/>`).join('')}<path d="M246 80 H300 M246 96 H300" stroke-width="3" stroke="${Y}"/><path d="M246 96 H300" stroke="${B}" stroke-width="3"/><text x="211" y="124" fill="${W}" font-size="11" text-anchor="middle">ચુંબક + કોઇલ</text><text x="300" y="72" fill="${DIM}" font-size="10" text-anchor="end">ECU તરફ</text>`,'રિલક્ટર વ્હીલ અને સેન્સર');
  const a=A();if(ca!==a){cached=wave();ca=a}const mk=((360-phi)%360)/360;
  el.querySelector('#sc').innerHTML=scope(cached,-Math.max(2,a*1.2),Math.max(2,a*1.2),{zero:1,mk,l:'1 આંટો (360°)',r:`±${fx(a,1)} V`});
  set(el,'rr',rpm);set(el,'rv',fx(a,1));set(el,'rf',rpm)};
 el.querySelector('#sl').oninput=e=>{rpm=+e.target.value;set(el,'slv',rpm);seen.add(rpm<300?'l':rpm>2500?'h':'m');if(seen.has('l')&&seen.has('h'))done();draw()};
 loop(el,(t,dt)=>{if(rpm>0&&!RM){phi=(phi+dt*360*(0.06+rpm/4000*0.35))%360}draw()});draw()};

/* Hall */
SIM.hall=(el,s,done)=>{const vss=s.sim.mode=='vss';let x=vss?40:800,phi=0,seen=new Set();
 el.innerHTML=`<div class="stage" id="st"></div><div class="stage" id="sc"></div><div class="readout">${lcd('ro','આઉટપુટ','V')}${lcd('rx',vss?'ઝડપ':'એન્જિન RPM',vss?'km/h':'')}${lcd('rf','ફ્રિક્વન્સી','Hz')}</div>${vss?slider('sl','વાહનની ઝડપ',0,120,x,1,'km/h'):slider('sl','એન્જિન RPM',0,4000,x,50,'')}<p class="muted">${vss?'ઝડપ વધે એટલે પલ્સ નજીક-નજીક આવે, ઊંચાઈ એ જ 5 V.':'કેમ, ક્રેન્કથી અડધી ઝડપે ફરે. 720° ક્રેન્કમાં માત્ર એક પલ્સ.'}</p>`;
 const N=vss?8:1,width=vss?22.5:40;
 const outAt=ang=>{for(let k=0;k<N;k++){const c=(k*360/N);let d=((ang-c)%360+360)%360;if(d<width)return 5}return 0};
 const draw=()=>{let tabs='';for(let k=0;k<N;k++){const a0=(phi+k*360/N)*Math.PI/180,a1=(phi+k*360/N+width)*Math.PI/180;tabs+=`<path d="M${100+60*Math.cos(a0)} ${88+60*Math.sin(a0)} A60 60 0 0 1 ${100+60*Math.cos(a1)} ${88+60*Math.sin(a1)} L${100+76*Math.cos(a1)} ${88+76*Math.sin(a1)} A76 76 0 0 0 ${100+76*Math.cos(a0)} ${88+76*Math.sin(a0)} Z" fill="${vss?R:'#9AA5AA'}"/>`}
  const rel=((360-phi)%360+360)%360,o=outAt(rel);
  el.querySelector('#st').innerHTML=SVG(320,176,`<circle cx="100" cy="88" r="60" fill="#2A3A40" stroke="#9AA5AA" stroke-width="2"/><circle cx="100" cy="88" r="10" fill="${W}"/>${tabs}<text x="100" y="172" fill="${DIM}" font-size="11" text-anchor="middle">${vss?'ચુંબકવાળું રિંગ':'કેમ ટ્રિગર વ્હીલ'}</text>
  <rect x="182" y="70" width="64" height="36" rx="5" fill="#4A5560"/><rect x="186" y="78" width="16" height="20" fill="${o?Y:'#2A3A40'}" stroke="${Y}"/><text x="194" y="118" fill="${W}" font-size="10" text-anchor="middle">હોલ ચિપ</text>
  ${o?`<path d="M178 88 H186" stroke="${T}" stroke-width="3"/><circle cx="194" cy="88" r="14" fill="none" stroke="${T}" opacity=".5"/>`:''}
  <path d="M246 78 H300" stroke="${R}" stroke-width="3"/><path d="M246 88 H300" stroke="${Y}" stroke-width="3"/><path d="M246 98 H300" stroke="${B}" stroke-width="3"/><text x="304" y="91" fill="${o?Y:DIM}" font-size="12">${o}V</text><text x="214" y="64" fill="${DIM}" font-size="10" text-anchor="middle">${s.ref} સપ્લાય</text>`,'હોલ સેન્સર');
  const pts=[];const span=vss?360:720;for(let i=0;i<=400;i++){const a=i/400*span;pts.push(vss?outAt(a):outAt(a/2))}
  const mk=vss?rel/360:((rel*2)%720)/720;
  el.querySelector('#sc').innerHTML=scope(pts,-0.5,6,{mk,l:vss?'શાફ્ટનો 1 આંટો':'ક્રેન્ક 720°',r:'0–5 V'});
  const f=vss?x*1.1:x/120;set(el,'ro',o);set(el,'rx',x);set(el,'rf',fx(f,1))};
 el.querySelector('#sl').oninput=e=>{x=+e.target.value;set(el,'slv',x);seen.add(x<(vss?15:300)?'l':x>(vss?80:2500)?'h':'m');if(seen.has('l')&&seen.has('h'))done();draw()};
 loop(el,(t,dt)=>{if(x>0&&!RM)phi=(phi+dt*360*(vss?0.03+x/120*0.25:0.05+x/4000*0.3))%360;draw()});draw()};

/* Pressure (piezo-resistive) */
SIM.press=(el,s,done)=>{const c=s.sim;let p=c.p0;const cv=cover(c.pmin,c.pmax,done);let ph=0;
 el.innerHTML=`<div class="stage" id="st"></div><div class="readout">${lcd('rp','દબાણ',c.unit)}${lcd('rv','સિગ્નલ','V')}${lcd('rs','ડાયાફ્રામ','')}</div>${slider('sl',c.med+' દબાણ',c.pmin,c.pmax,p,c.pmax>500?10:1,c.unit)}<div class="stage" id="gr"></div><p class="muted">${c.marks.map(m=>`${m[1]}: ${m[0]} ${c.unit}`).join('  |  ')}</p>`;
 const draw=()=>{const k=(p-c.pmin)/(c.pmax-c.pmin),d=k*22,v=s.sig(p);let dots='';const n=4+Math.round(k*26);for(let i=0;i<n;i++){const xx=40+((i*53+ph*40*(1+k))%230),yy=128+((i*37)%30);dots+=`<circle cx="${xx}" cy="${yy}" r="2.5" fill="${c.c}"/>`}
  const g=(x,t)=>`<rect x="${x}" y="${96-d*0.55-(t?2:0)}" width="16" height="5" fill="${t?R:'#5B9BE6'}" opacity="${0.35+k*0.65}"/>`;

  <path d="M110 100 Q155 ${100-d*2} 200 100" stroke="${Y}" stroke-width="3" fill="none"/>${g(120,0)}${g(140,1)}${g(156,1)}${g(176,0)}

  <rect x="222" y="40" width="70" height="40" rx="5" fill="#1D4E89"/><text x="257" y="58" fill="#fff" font-size="10" text-anchor="middle">એમ્પ્લિફાયર</text><text x="257" y="72" fill="#fff" font-size="10" text-anchor="middle">ચિપ</text>
  <path d="M200 60 H222" stroke="${W}"/><path d="M292 60 H312" stroke="${Y}" stroke-width="3"/><text x="310" y="52" fill="${Y}" font-size="11" text-anchor="end">${fx(v)} V</text><text x="155" y="30" fill="${W}" font-size="11" text-anchor="middle">સિલિકોન ડાયાફ્રામ + સ્ટ્રેન ગેજ</text>`,'પ્રેશર સેન્સર');
  set(el,'rp',p);set(el,'rv',fx(v));set(el,'rs',k<0.05?'સપાટ':k<0.5?'થોડો વળ્યો':'વધુ વળ્યો');
  el.querySelector('#gr').innerHTML=curve(s.sig,c.pmin,c.pmax,p,5,'દબાણ →','સિગ્નલ V')};
 el.querySelector('#sl').oninput=e=>{p=+e.target.value;set(el,'slv',p);cv(p);draw()};
 loop(el,(t,dt)=>{if(!RM){ph+=dt;draw()}});draw()};

/* MAF hot film */
SIM.maf=(el,s,done)=>{let f=20,ph=0;const cv=cover(0,600,done);
 el.innerHTML=`<div class="stage" id="st"></div><div class="readout">${lcd('rf','હવા','kg/h')}${lcd('ri','હીટર કરંટ','mA')}${lcd('rv','સિગ્નલ','V')}</div>${slider('sl','હવાનો પ્રવાહ (લોડ)',0,600,f,5,'kg/h')}<div class="stage" id="gr"></div><p class="muted">ફિલ્મનું તાપમાન સ્થિર રાખવા જે કરંટ જોઈએ, તે જ માપ છે.</p>`;
 const draw=()=>{const k=f/600,v=s.sig(f),cur=60+Math.sqrt(k)*240;let parts='';const n=8+Math.round(k*24);for(let i=0;i<n;i++){const xx=(i*41+ph*(30+k*400))%300+10,yy=52+(i*29)%70;parts+=`<line x1="${xx}" y1="${yy}" x2="${xx+6+k*14}" y2="${yy}" stroke="${W}" stroke-width="2" opacity=".7"/>`}

  <rect x="146" y="70" width="28" height="34" rx="3" fill="#FF6A3C" opacity="${0.55+0.45*(1-k*0.4)}"/><text x="160" y="146" fill="${W}" font-size="11" text-anchor="middle">હોટ ફિલ્મ (હવા + 100°C)</text>
  <rect x="200" y="140" width="${cur/300*100}" height="10" fill="${Y}"/><text x="200" y="168" fill="${DIM}" font-size="10">હીટર કરંટ</text><path d="M160 70 V20 H300" stroke="${Y}" stroke-width="3" fill="none"/><text x="298" y="14" fill="${Y}" font-size="11" text-anchor="end">${fx(v)} V</text>`,'હોટ ફિલ્મ MAF');
  set(el,'rf',f);set(el,'ri',Math.round(cur));set(el,'rv',fx(v));el.querySelector('#gr').innerHTML=curve(s.sig,0,600,f,5,'kg/h →','સિગ્નલ V')};
 el.querySelector('#sl').oninput=e=>{f=+e.target.value;set(el,'slv',f);cv(f);draw()};

/* Knock piezo */
SIM.knock=(el,s,done)=>{let kn=false,ph=0,hist=[];
 el.innerHTML=`<div class="stage" id="st"></div><div class="stage" id="sc"></div><div class="readout">${lcd('rk','પીક સિગ્નલ','mV')}${lcd('ra','ECU પગલું')}</div><button class="btn p" id="kb">નોકિંગ શરૂ કરો</button><p class="muted">દરેક દહન વખતે એક નાનું કંપન આવે. નોકિંગમાં ઝડપી, મોટા ઝટકા.</p>`;
 el.querySelector('#kb').onclick=e=>{kn=!kn;e.target.textContent=kn?'નોકિંગ બંધ કરો':'નોકિંગ શરૂ કરો';e.target.classList.toggle('on',kn);if(kn)done()};
 const sig=t=>{const per=0.25,tt=t%per;const amp=kn?0.25:0.02;const f=kn?60:25;return tt<0.12?amp*Math.exp(-tt*28)*Math.sin(2*Math.PI*f*tt):(Math.random()-.5)*0.004};
 const draw=t=>{const pts=[];for(let i=0;i<=300;i++)pts.push(sig(t+i/300*1));const pk=kn?250:20,sq=Math.abs(sig(t))/0.25*6;
  el.querySelector('#st').innerHTML=SVG(320,140,`<rect x="40" y="110" width="240" height="18" fill="#4A5560"/><text x="160" y="138" fill="${DIM}" font-size="10" text-anchor="middle">સિલિન્ડર બ્લોક</text>
  <rect x="130" y="${84+sq}" width="60" height="${26-sq}" fill="#C9B47A"/><text x="160" y="${101+sq/2}" fill="#2a2010" font-size="10" text-anchor="middle">ક્રિસ્ટલ</text><rect x="125" y="${58+sq}" width="70" height="26" fill="#9AA5AA"/><text x="160" y="${75+sq}" fill="#222" font-size="10" text-anchor="middle">વજન (માસ)</text>
  ${sq>1.5?`<text x="118" y="104" fill="${R}" font-size="16">+</text><text x="196" y="104" fill="#5B9BE6" font-size="16">−</text>`:''}<path d="M190 96 H300" stroke="${Y}" stroke-width="3"/><text x="300" y="88" fill="${Y}" font-size="11" text-anchor="end">${kn?'મોટો ઝટકો':'નાનું સિગ્નલ'}</text>`,'નોક સેન્સર');
  el.querySelector('#sc').innerHTML=scope(pts,-0.3,0.3,{zero:1,l:'સમય →',r:'±300 mV'});set(el,'rk',pk);set(el,'ra',kn?'ટાઇમિંગ મોડું':'સામાન્ય')};
 loop(el,(t)=>draw(RM?0:t*0.6));draw(0)};

/* O2 zirconia */
SIM.o2=(el,s,done)=>{let lam=1.0,hot=true,cl=false,hist=Array(160).fill(0.45),acc=0,sr=false,sl=false;
 el.innerHTML=`<div class="stage" id="st"></div><div class="stage" id="sc"></div><div class="readout">${lcd('rl','લેમ્ડા λ')}${lcd('rv','સિગ્નલ','V')}${lcd('rm','મિશ્રણ')}</div>${slider('sl','મિશ્રણ (λ)',0.80,1.20,1.00,0.01,'')}
 <div class="flex"><button class="btn on" id="bh">હીટર: ચાલુ</button><button class="btn" id="bc">ECU ક્લોઝ્ડ લૂપ: બંધ</button></div><p class="muted">λ = 1 એટલે આદર્શ મિશ્રણ (14.7:1 પેટ્રોલ). λ < 1 રિચ, λ > 1 લીન.</p>`;
 const V=l=>hot?0.1+0.8/(1+Math.exp((l-1)*90)):0.45;
 el.querySelector('#sl').oninput=e=>{lam=+e.target.value;set(el,'slv',fx(lam));if(lam<0.97)sr=true;if(lam>1.03)sl=true;if(sr&&sl)done()};
 el.querySelector('#bh').onclick=e=>{hot=!hot;e.target.textContent='હીટર: '+(hot?'ચાલુ':'બંધ');e.target.classList.toggle('on',hot)};
 el.querySelector('#bc').onclick=e=>{cl=!cl;e.target.textContent='ECU ક્લોઝ્ડ લૂપ: '+(cl?'ચાલુ':'બંધ');e.target.classList.toggle('on',cl)};
 const draw=t=>{const l=cl?1+0.035*Math.sin(t*4):lam,v=V(l);acc+=1;hist.push(v);hist.shift();
  const nO=Math.round(clamp((l-0.78)*60,1,26));let ex='',air='',ion='';for(let i=0;i<nO;i++)ex+=`<circle cx="${20+(i*23+t*30)%90}" cy="${40+(i*31)%100}" r="3" fill="#7EC8F0"/>`;for(let i=0;i<26;i++)air+=`<circle cx="${210+(i*19+t*20)%95}" cy="${40+(i*37)%100}" r="3" fill="#7EC8F0"/>`;
  if(hot){const ni=Math.round(v*8);for(let i=0;i<ni;i++){const q=((t*0.8+i/ni)%1);ion+=`<circle cx="${200-q*80}" cy="${50+i*11}" r="3.5" fill="${Y}"/>`}}
  el.querySelector('#st').innerHTML=SVG(320,176,`<rect x="10" y="30" width="110" height="120" fill="#3A3A3A" opacity=".6"/><text x="65" y="22" fill="${W}" font-size="11" text-anchor="middle">એક્ઝોસ્ટ</text>${ex}
  <rect x="120" y="30" width="80" height="120" fill="${hot?'#E8B04A':'#C9C2B0'}" opacity=".85"/><text x="160" y="164" fill="${W}" font-size="10" text-anchor="middle">ઝિર્કોનિયા ${hot?'(ગરમ)':'(ઠંડો)'}</text>
  <rect x="118" y="30" width="4" height="120" fill="#ddd"/><rect x="198" y="30" width="4" height="120" fill="#ddd"/><rect x="200" y="30" width="110" height="120" fill="#20404A" opacity=".6"/><text x="255" y="22" fill="${W}" font-size="11" text-anchor="middle">બહારની હવા</text>${air}${ion}`,'ઓક્સિજન સેન્સર');
  el.querySelector('#sc').innerHTML=scope(hist,0,1,{l:'સિગ્નલ ઇતિહાસ',r:'0–1 V'});set(el,'rl',fx(l));set(el,'rv',fx(v));set(el,'rm',!hot?'સેન્સર ઠંડો':v>0.55?'રિચ':v<0.35?'લીન':'λ ≈ 1')};
 loop(el,t=>draw(RM?0:t));draw(0)};

/* Thermocouple */
SIM.tc=(el,s,done)=>{let t=200,ph=0;const cv=cover(0,900,done);
 el.innerHTML=`<div class="stage" id="st"></div><div class="readout">${lcd('rt','ગેસ તાપમાન','°C')}${lcd('rv','થર્મોકપલ','mV')}${lcd('ra','ECU પગલું')}</div>${slider('sl','એક્ઝોસ્ટ તાપમાન',0,900,t,10,'°C')}<div class="stage" id="gr"></div>`;

/* NOx + SCR */
SIM.nox=(el,s,done)=>{let L=40,dz=0,ph=0,a=false,b=false;
 el.innerHTML=`<div class="stage" id="st"></div><div class="readout">${lcd('ru','NOx (SCR પહેલાં)','ppm')}${lcd('rd','NOx (SCR પછી)','ppm')}${lcd('re','SCR કાર્યક્ષમતા','%')}</div>${slider('sl','એન્જિન લોડ',0,100,L,1,'%')}${slider('sd','એડબ્લૂ ડોઝિંગ',0,150,dz,5,'%')}<p class="fb" id="fw"></p><p class="muted">ECU બંને સેન્સર સરખાવી એડબ્લૂ માત્રા નક્કી કરે.</p>`;
 const calc=()=>{const up=200+12*L,eff=0.95*Math.min(dz,100)/100,dn=up*(1-eff);return{up,dn,eff,slip:dz>110}};
 const draw=()=>{const c=calc();let dots='';const nu=Math.round(c.up/80),nd=Math.round(c.dn/80);for(let i=0;i<nu;i++)dots+=`<circle cx="${20+((i*31+ph*40)%90)}" cy="${70+(i*17)%40}" r="3" fill="${R}"/>`;for(let i=0;i<nd;i++)dots+=`<circle cx="${220+((i*29+ph*40)%85)}" cy="${70+(i*19)%40}" r="3" fill="${R}"/>`;
  let sp='';const ns=Math.round(dz/15);for(let i=0;i<ns;i++)sp+=`<circle cx="${112+((i*7+ph*30)%20)}" cy="${62+(i*9)%40}" r="2" fill="#7EC8F0"/>`;
  el.querySelector('#st').innerHTML=SVG(320,170,`<rect x="6" y="60" width="308" height="56" fill="#2A3A40" stroke="${W}"/><rect x="140" y="52" width="70" height="72" rx="6" fill="#6E7F86"/><text x="175" y="92" fill="#fff" font-size="12" text-anchor="middle">SCR</text>
  <rect x="104" y="30" width="10" height="30" fill="#7EC8F0"/><text x="109" y="24" fill="${W}" font-size="10" text-anchor="middle">એડબ્લૂ</text>${sp}${dots}
  <rect x="64" y="40" width="10" height="20" fill="${Y}"/><text x="69" y="34" fill="${Y}" font-size="10" text-anchor="middle">NOx 1</text><rect x="252" y="40" width="10" height="20" fill="${Y}"/><text x="257" y="34" fill="${Y}" font-size="10" text-anchor="middle">NOx 2</text>
  <text x="160" y="150" fill="${DIM}" font-size="10" text-anchor="middle">લાલ બિંદુ = NOx</text>`,'NOx અને SCR');
  set(el,'ru',Math.round(c.up));set(el,'rd',Math.round(c.dn));set(el,'re',Math.round(c.eff*100));const fw=el.querySelector('#fw');if(c.slip)setFb(fw,false,'વધુ ડોઝિંગ: એમોનિયા સ્લિપ! NOx સેન્સર એમોનિયાને પણ NOx માની વાંચે છે.');else{fw.className='fb';fw.textContent=''}};
 el.querySelector('#sl').oninput=e=>{L=+e.target.value;set(el,'slv',L);draw()};
 el.querySelector('#sd').oninput=e=>{dz=+e.target.value;set(el,'sdv',dz);if(dz<20)a=true;if(dz>=90&&dz<=110)b=true;if(a&&b)done();draw()};
 loop(el,(t,dt)=>{if(!RM){ph+=dt;draw()}});draw()};

function renderDiag(){$('#ttl').textContent='ખામી શોધો';$('#back').style.visibility='visible';const order=shuffle(CASES.map((_,i)=>i));let k=0,sc=0;
 const draw=()=>{if(k>=order.length){app.innerHTML=`<h2>પરિણામ: ${sc} / ${order.length}</h2><p>${sc>=10?'શાબાશ! સ્કેન ડેટા વાંચવામાં તમે માહિર છો.':'સેન્સરનાં "સામાન્ય મૂલ્યો" ફરી જુઓ અને ફરી પ્રયત્ન કરો.'}</p><button class="btn p" id="rs">ફરી શરૂ કરો</button>`;$('#rs').onclick=renderDiag;return}
  const c=CASES[order[k]];app.innerHTML=`<p class="muted">કેસ ${k+1} / ${order.length} · સાચા: ${sc}</p><div class="case"><b>ફરિયાદ:</b> ${c.c}<br><b>ફોલ્ટ કોડ:</b> ${c.dtc}</div>
  <div class="panel"><h3 style="margin-top:0">સ્કેન ટૂલ લાઇવ ડેટા</h3><div class="tbl"><table>${c.d.map(([a,b])=>`<tr><td>${a}</td><td class="v">${b}</td></tr>`).join('')}</table></div></div>
  <h3>કયો સેન્સર કે તેનું સર્કિટ ખામીવાળું?</h3><div class="col">${shuffle(c.o).map(o=>`<button class="opt" data-o="${o}">${byId(o).ab}: ${byId(o).gu}</button>`).join('')}</div><p class="fb" id="df"></p><button class="btn p" id="nx" hidden>આગળનો કેસ</button>`;
  let first=true;on(app,'[data-o]',b=>{const ok=b.dataset.o==c.a;b.classList.add(ok?'right':'wrong');if(ok){if(first)sc++;const s=byId(c.a);setFb($('#df'),true,`સાચું! ${s.ab}. પહેલાં તેનું વાયરિંગ અને કનેક્ટર તપાસો, પછી સેન્સર.`);app.querySelectorAll('[data-o]').forEach(x=>x.disabled=true);$('#nx').hidden=false}else{first=false;setFb($('#df'),false,'ફરી વિચારો: કયું લાઇવ મૂલ્ય અશક્ય કે અસામાન્ય છે?')}});
  $('#nx').onclick=()=>{k++;draw();window.scrollTo(0,0)}};draw()}
function renderQuiz(){$('#ttl').textContent='ક્વિઝ';$('#back').style.visibility='visible';const Q=shuffle(QUIZ);let k=0,sc=0;
 const draw=()=>{if(k>=Q.length){app.innerHTML=`<h2>સ્કોર: ${sc} / ${Q.length}</h2><p>${sc==Q.length?'પૂરા માર્ક! સેન્સરના સિદ્ધાંત પાકા છે.':'જે ખોટા પડ્યા તેનો "સિદ્ધાંત" ટેબ ફરી વાંચો.'}</p><button class="btn p" id="rs">ફરી રમો</button>`;$('#rs').onclick=renderQuiz;return}
  const [q,...o]=Q[k];app.innerHTML=`<p class="muted">પ્રશ્ન ${k+1} / ${Q.length} · સ્કોર ${sc}</p><div class="panel"><h3 style="margin-top:0">${q}</h3><div class="col">${shuffle(o).map(x=>`<button class="opt" data-o="${x}">${x}</button>`).join('')}</div><p class="fb" id="qf"></p></div>`;
  on(app,'[data-o]',b=>{const ok=b.dataset.o==o[0];if(ok)sc++;b.classList.add(ok?'right':'wrong');if(!ok)app.querySelectorAll('[data-o]').forEach(x=>{if(x.dataset.o==o[0])x.classList.add('right')});app.querySelectorAll('[data-o]').forEach(x=>x.disabled=true);setFb($('#qf'),ok,ok?'સાચું!':'સાચો જવાબ લીલામાં.');setTimeout(()=>{k++;draw()},1300)})};draw()}
function route(){const h=location.hash.slice(1).split('/');updTop();if(h[0]=='s')renderSensor(h[1],h[2]);else if(h[0]=='basics')renderBasics();else if(h[0]=='diag')renderDiag();else if(h[0]=='quiz')renderQuiz();else{renderHome();window.scrollTo(0,0)}}
$('#back').onclick=()=>{location.hash=''};
window.addEventListener('hashchange',route);route();
</script>
